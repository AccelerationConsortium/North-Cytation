  llm_config_path: C:\Users\owenm\OneDrive\Desktop\North Robotics\utoronto_demo\utoronto_demo\sdl_pipette_calibration\calibration_screening_llm_template.json
  external_data:
    enabled: false
    data_path: C:\Users\owenm\OneDrive\Desktop\North Robotics\utoronto_demo\utoronto_demo\sdl_pipette_calibration\input_data\external_calibration_data.csv
    volume_filter_ml: null
    liquid_filter: null
    required_columns: []
tolerances:
  simulation:
    deviation_multiplier: 1.5
    variability_multiplier: 1.5
  volume_ranges:
  - volume_min_ul: 200
    volume_max_ul: 1000
    tolerance_pct: 1.0
  - volume_min_ul: 60
    volume_max_ul: 199
    tolerance_pct: 2.0
  - volume_min_ul: 20
    volume_max_ul: 59
    tolerance_pct: 3.0
  - volume_min_ul: 2.5
    volume_max_ul: 19
    tolerance_pct: 10.0
  - volume_min_ul: 0
    volume_max_ul: 2.499
    tolerance_pct: 10.0
adaptive_measurement:
