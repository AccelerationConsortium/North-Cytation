# Named carousel positions, used by North_Base.move_carousel_to(name).
# Each position is passed to c9.move_carousel(angle, height).
# Reservoir access positions are stored per pump in syringe_pumps.yaml (carousel_angle / carousel_height).

home:                    # Stowed position; used after powder and reservoir dispensing and by move_home
  angle: 0
  height: 0
powder_dispense_mg:      # Under the powder dispenser, for mass-targeted dispensing (dispense_powder_mg)
  angle: 66.5
  height: 70
