# North Robot hardware configuration
# Hardware axis and pneumatic mappings for both North_Robot and North_Track systems

# North Robot motion axes (C9 controller)
# Based on actual hardware mapping: [gripper, elbow, shoulder, z-axis]
robot_axes:
  gripper_axis: 0   # Gripper rotation/movement axis
  elbow_axis: 1     # Elbow joint axis  
  shoulder_axis: 2  # Shoulder joint axis
  z_axis: 3         # Z-axis for vertical movement
  
# Track system axes (separate from robot axes)
track_axes:
  x_axis: 7  # Track X-axis (horizontal movement)
  z_axis: 6  # Track Z-axis (vertical movement)

# Pneumatic outputs for track gripper
track_pneumatics:
  gripper_open: 4   # Pneumatic output for opening track gripper
  gripper_close: 5  # Pneumatic output for closing track gripper

# Pneumatic output for the robot arm's vial gripper (used by open_vial_gripper / close_vial_gripper)
robot_pneumatics:
  vial_gripper: 7   # True = close (grip), False = open (release)

# Pneumatic outputs for the centrifuge (North_Spin)
centrifuge_pneumatics:
  lid: 11      # True = open lid, False = close lid
  vacuum: 10   # True = vacuum on, False = vacuum off

# Movement speeds (mm/s or units/s)
# ORIGINAL VALUES (commented for restoration): default_robot: 20, fast_approach: 30, standard_xy: 15, precise_movement: 5, retract: 5
movement_speeds:
  default_robot: 20       # Default velocity for robot initialization (was: 20)
  fast_approach: 30       # Fast approach movements (was: 30)
  standard_xy: 15         # Standard XY positioning speed (was: 15)  
  precise_movement: 5    # Precise/slow movements (unchanged)
  retract: 5            # Speed when retracting pipet from liquid (unchanged)

# Gripper settling times (seconds)
gripper_timing:
  grab_settle_time_s: 1.0  # Additional wait after closing, beyond the SDK delay
  release_settle_time_s: 0.5  # Additional wait after opening, beyond the SDK delay
  uncap_position_settle_time_s: 0.5  # Before closing around the cap
  uncap_grip_settle_time_s: 1.0  # After closing, before unscrewing; beyond the SDK delay
  recap_position_settle_time_s: 0.5  # Before screwing the held cap onto the vial

# Physical constants
physical_constants:
  safe_height_z: 292    # Safe height for general robot movements

# Module state readout (Lash_E.get_module_state; see docs/plans/archive/module_state_readout.md)
module_state:
  track_parked_location: origin   # The track is ready only when parked here
  station_locations:              # Resource name -> vial location in vial_positions.yaml
    clamp: clamp
    clamp_2: clamp_2
    heater: heater
    photoreactor: photoreactor_array

# Safe stop (Lash_E.safe_stop): instruments to switch off after an error or interrupt
safe_stop:
  heater_channels: [0]            # North_Temp channels to turn off
  photoreactor_reactors: [0]   # Photoreactor reactor numbers: LED and fan off (one reactor installed)
