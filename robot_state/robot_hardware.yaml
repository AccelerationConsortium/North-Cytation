# North Robot hardware configuration
# Hardware axis and pneumatic mappings for both North_Robot and North_Track systems

# North Robot motion axes (C9 controller)
# Based on actual hardware mapping: [gripper, elbow, shoulder, z-axis]
robot_axes:
  gripper_axis: 0   # Gripper rotation/movement axis
  elbow_axis: 1     # Elbow joint axis  
  shoulder_axis: 2  # Shoulder joint axis
  z_axis: 3         # Z-axis for vertical movement
  
# Track system axes (separate from robot axes)
track_axes:
  x_axis: 7  # Track X-axis (horizontal movement)
  z_axis: 6  # Track Z-axis (vertical movement)

# Pneumatic outputs for track gripper
track_pneumatics:
  gripper_open: 4   # Pneumatic output for opening track gripper
  gripper_close: 5  # Pneumatic output for closing track gripper

# Pneumatic output for the robot arm's vial gripper (used by open_vial_gripper / close_vial_gripper)
robot_pneumatics:
  vial_gripper: 7   # True = close (grip), False = open (release)

# Pneumatic outputs for the centrifuge (North_Spin)
centrifuge_pneumatics:
  lid: 11      # True = open lid, False = close lid
  vacuum: 10   # True = vacuum on, False = vacuum off

# Movement speeds (percent of max velocity, 1-100: speed_limits below)
# ORIGINAL VALUES (commented for restoration): default_robot: 20, fast_approach: 30, standard_xy: 15, precise_movement: 5, retract: 5
movement_speeds:
  default_robot: 20       # Default velocity for robot initialization (was: 20)
  fast_approach: 30       # Fast approach movements (was: 30)
  standard_xy: 15         # Standard XY positioning speed (was: 15)  
  precise_movement: 5    # Precise/slow movements (unchanged)
  retract: 5            # Speed when retracting pipet from liquid (unchanged)

# Gripper settling times (seconds)
gripper_timing:
  grab_settle_time_s: 1.0  # Additional wait after closing, beyond the SDK delay
  release_settle_time_s: 0.5  # Additional wait after opening, beyond the SDK delay
  uncap_position_settle_time_s: 0.5  # Before closing around the cap
  uncap_grip_settle_time_s: 1.0  # After closing, before unscrewing; beyond the SDK delay
  recap_position_settle_time_s: 0.5  # Before screwing the held cap onto the vial

# Allowed vortex_vial inputs; values outside are refused before the vial is picked up
vortex_limits:
  min_time_s: 1
  max_time_s: 60
  min_speed: 1    # Speeds are normalized 0-100; 0 would not move
  max_speed: 99

# Allowed North_Temp.set_temp / autotune inputs; values outside are refused before sending
heater_limits:
  min_c: 0
  max_c: 250          # Technical max of the heater
  warn_above_c: 100   # Allowed, but logs a warning
  channels: [0, 7]    # First and last T8 channel

# Allowed stirrer (North_Temp.turn_on_stirring) and centrifuge (North_Spin.set_speed) speeds, in motor
# counts/s (spin_axis takes counts/s, not a percentage; 100000 is the hardware max); 0 stops via the stop methods
stirrer_limits:
  min_speed: 1
  max_speed: 100000
spinner_limits:
  min_speed: 1
  max_speed: 100000

# Allowed named move speeds (movement_speeds above, speeds in track_positions.yaml), as percent of max
# velocity; the C9 reads 0-100 as percent and larger values as counts/s, so values outside are refused
speed_limits:
  min_percent: 1
  max_percent: 100

# Allowed North_Powder.dispense_powder_mg masses (mg); must also be > 0. Refused before moving
powder_limits:
  max_mg: 1000

# Allowed liquid-handling parameters (PipettingParameters / ReservoirParameters, after defaults,
# calibration and overrides are combined); None uses the default. Refused before moving.
# Ranges cover every calibrated value and optimizer bound in use (2026-11-19).
parameter_limits:
  aspirate_speed: {min: 1, max: 40, unit: (pump speed code)}
  dispense_speed: {min: 1, max: 40, unit: (pump speed code)}
  blowout_speed: {min: 1, max: 40, unit: (pump speed code)}
  retract_speed: {min: 1, max: 100, unit: '%'}     # Arm velocity, percent of max (like speed_limits)
  aspirate_wait_time: {min: 0, max: 60, unit: s}
  dispense_wait_time: {min: 0, max: 60, unit: s}
  post_retract_wait_time: {min: 0, max: 60, unit: s}
  valve_switch_delay: {min: 0, max: 60, unit: s}
  overaspirate_vol: {min: -1, max: 1, unit: mL}  # Negative values are used for some liquids
  pre_asp_air_vol: {min: 0, max: 1, unit: mL}
  post_asp_air_vol: {min: 0, max: 1, unit: mL}
  blowout_vol: {min: 0, max: 1, unit: mL}
  asp_disp_cycles: {min: 0, max: 10, whole: true}

# Scale recording around an aspirate or dispense (North_Base.start_scale_recording); no waits in simulation
scale_recording:
  settle_s: 1.0          # Wait after positioning, before recording (aspirate and dispense; not reservoir)
  pre_baseline_s: 2.0    # Record this long before the liquid step
  post_baseline_s: 2.0   # Record this long after it
  read_interval_s: 0.2   # 5 Hz
  stop_timeout_s: 2.0    # Wait this long for the recording thread to finish

# Physical constants
physical_constants:
  safe_height_z: 292    # Safe height for general robot movements

# Module state readout (Lash_E.get_module_state; see docs/plans/module_state_readout.md)
module_state:
  track_parked_location: origin   # The track is ready only when parked here
  station_locations:              # Resource name -> vial location in vial_positions.yaml
    clamp: clamp
    clamp_2: clamp_2
    heater: heater
    photoreactor: photoreactor_array

# Safe stop (Lash_E.safe_stop): instruments to switch off after an error or interrupt
safe_stop:
  heater_channels: [0]            # North_Temp channels to turn off
  photoreactor_reactors: [0]   # Photoreactor reactor numbers: LED and fan off (one reactor installed)
