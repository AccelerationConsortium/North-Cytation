main_8mL_rack:
  rack_present: true
  tip_held_move_indices: [0, 1, 2, 3, 4, 5]  # Only these can be reached moving a vial with a tip held (height)
  release_height_offset_mm: 4.0  # Positive raises release above the Locator pickup position
  vial_positions_in_Locator: rack  # Variable name in Locator.py for gripper positions
  pipetting_positions_in_Locator: rack_pip  # Variable name in Locator.py for pipetting positions
  rack_size: 48  # Number of positions in the rack
  small_tip_safe_indices: [43, 44, 45, 46, 47]  # Small tip can reach the bottom without problems
  small_tip_staging_rank: {47: 1, 46: 2, 45: 3, 44: 7, 43: 8}  # stage_vials order for open vials across locations (1 = safest); 44 and 43 have had pull-outs
  vial_volume: 8  # Standard vial volume in mL
  height_volume_constant: 6
  vials_movable: true  # Whether vials can be moved (if capped and 8mL type)
  min_pipetting_height: 68.5  # Base height for pipetting
  grid_params:
    num_cols: 8       # Columns (X direction)
    num_rows: 6       # Rows (Y direction)
    x_delta_mm: 26.0  # mm between columns
    y_delta_mm: 26.0  # mm between rows

large_vial_rack:
  rack_present: true
  release_height_offset_mm: 0.0
  vial_positions_in_Locator: null  # No gripper positions defined - vials not movable
  pipetting_positions_in_Locator: large_vial_pip  # Variable name in Locator.py for pipetting positions
  rack_size: 4  # Number of positions in the rack
  vial_volume: 20  # Standard vial volume in mL
  height_volume_constant: 2
  vials_movable: false  # Vials cannot be moved
  min_pipetting_height: 94.5  # Base height for pipetting
  grid_params:
    num_cols: 2
    num_rows: 2
    x_delta_mm: null
    y_delta_mm: null

clamp_2:
  rack_present: true
  release_height_offset_mm: 3.0
  vial_positions_in_Locator: clamp_2  # Single clamp position for gripper
  pipetting_positions_in_Locator: clamp_2_pip  # No pipetting position defined for this clamp
  rack_size: 1  # Single position
  small_tip_safe_indices: [0]
  # Not a staging target since 2026-11-16: a missed pickup here caused a collision, and the
  # deck camera can't yet see vials in clamp_2. heater[2] took its place.
  vial_volume: 8  # Variable - depends on vial placed in clamp
  height_volume_constant: 6
  vials_movable: true  # Vials can be moved (this is the manipulation station)
  min_pipetting_height: 63.0 #May need tuning
  grid_params:
    num_cols: 1
    num_rows: 1
    x_delta_mm: null
    y_delta_mm: null

