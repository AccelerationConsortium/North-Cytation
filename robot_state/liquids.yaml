# Shared liquid properties for calibration and gravimetric validation.
# Keys must match LIQUID/liquid_type exactly; entry order does not matter.
# Use density appropriate to the actual composition and measurement temperature.
# refill_pipets: true removes the tip after each calibration measurement.
liquids:
  water: {density_g_ml: 1.00, refill_pipets: false}
  ethanol: {density_g_ml: 0.789, refill_pipets: false}
  toluene: {density_g_ml: 0.867, refill_pipets: false}
  heptane: {density_g_ml: 0.680, refill_pipets: false}
  2MeTHF: {density_g_ml: 0.852, refill_pipets: false}
  isopropanol: {density_g_ml: 0.789, refill_pipets: false}
  DMSO: {density_g_ml: 1.1, refill_pipets: false}
  acetone: {density_g_ml: 0.79, refill_pipets: false}
  ethyl_acetate: {density_g_ml: 0.902, refill_pipets: false}
  glycerol: {density_g_ml: 1.26, refill_pipets: true}
  PEG_Water: {density_g_ml: 1.05, refill_pipets: true}
  4%_hyaluronic_acid_water: {density_g_ml: 1.01, refill_pipets: true}
  agar_water: {density_g_ml: 1.01, refill_pipets: false}
  agar_water_refill: {density_g_ml: 1.01, refill_pipets: true}
  agar_water_4%: {density_g_ml: 1.01, refill_pipets: true}
  TFA: {density_g_ml: 1.49, refill_pipets: false}
  6M_HCl: {density_g_ml: 1.10, refill_pipets: false}
  6M_TFA: {density_g_ml: 1.25, refill_pipets: false}
  6M_p_TSA: {density_g_ml: 1.25, refill_pipets: false}
  6M_Citric_Acid: {density_g_ml: 1.27, refill_pipets: false}
  6M_H2SO4: {density_g_ml: 1.34, refill_pipets: false}
  6M_H3PO4: {density_g_ml: 1.35, refill_pipets: false}
  PVA_water: {density_g_ml: 1.01, refill_pipets: false}
  PVA_DMSO: {density_g_ml: 1.11, refill_pipets: true}
  SDS: {density_g_ml: 1.00, refill_pipets: false}
