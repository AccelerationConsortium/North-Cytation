large_tip:
  volume: 1.0
  capacity_margin: 0.010  # Prefer another tip when the load comes within 10 uL of capacity
  min_suggested_volume: 0.15
  removal_location: p_remove_cap
  delta_z_to_tip_bottom: 0
  default_aspirate_speed: 11  # Default aspiration speed for large tips
small_tip:
  volume: 0.20
  capacity_margin: 0.005  # Prefer another tip when the load comes within 5 uL of capacity
  min_suggested_volume: 0.001
  removal_location: p_remove_small
  delta_z_to_tip_bottom: -22 #Technically up 19 mm
  default_aspirate_speed: 13  # Default aspiration speed for small tips

